name: ci

# Every pull request runs the checks. A push to master runs them again and, if
# all pass, publishes the image the `docker` job rehearsed and deploys it. The
# VPS never builds and holds no git credentials: it only pulls from GHCR. The
# image contains no book: books live in the server's database.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to a pull request supersedes the running checks. On master
# nothing is cancelled: a deploy cut halfway could leave the server's .env
# naming a tag that never went healthy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dbsiavichay/lectio
  SITE_URL: https://lectio.dbsiavichay.dev

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The parser tests run on the example book; the real one never reaches CI.
      - run: npm run test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The image that gets published, built once and run the way the VPS runs it:
  # deploy/compose.yml, hardened, behind a Caddy loading lectio.caddy.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lectio:smoke
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rehearse the production topology
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          deploy/smoke/smoke.sh up
          deploy/smoke/smoke.sh check
      - name: Tear down
        if: always()
        run: deploy/smoke/smoke.sh down
      - name: Save the image for publishing
        if: github.event_name == 'push'
        run: docker save lectio:smoke | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  # Catches what would otherwise fail on the VPS halfway through a deploy.
  deploy-config:
    name: deploy config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/scripts/*.sh deploy/smoke/*.sh
      - name: Render the compose files
        run: |
          docker compose -f deploy/compose.yml config -q
          docker compose -f deploy/compose.yml -f deploy/smoke/compose.yml config -q
      - name: Validate lectio.caddy
        run: |
          docker run --rm \
            -v "$PWD/deploy/smoke/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/caddy:/etc/caddy/sites:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check Caddyfile formatting
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" caddy:2-alpine sh -c '
            for f in /deploy/caddy/*.caddy /deploy/smoke/Caddyfile; do
              caddy fmt "$f" | diff -u "$f" - || exit 1
            done'

  publish:
    if: github.event_name == 'push'
    needs: [quality, e2e, docker, deploy-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Load the rehearsed image
        run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sha-<7> and latest
        id: push
        run: |
          tag="sha-${GITHUB_SHA::7}"
          for t in "$tag" latest; do
            docker tag lectio:smoke "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    concurrency:
      group: deploy-production-lectio
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" > /tmp/host_keys 2>/dev/null || true
          if [ ! -s /tmp/host_keys ]; then
            echo "ssh-keyscan got no host key from ${VPS_HOST}:${VPS_SSH_PORT}." >&2
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts
          printf '%s\n' "Host vps" "  HostName ${VPS_HOST}" "  Port ${VPS_SSH_PORT}" \
            "  User ${VPS_USER}" "  IdentityFile ~/.ssh/deploy_key" "  BatchMode yes" \
            "  StrictHostKeyChecking yes" "  ServerAliveInterval 30" > ~/.ssh/config

      # tar, not scp, so the scripts keep their exec bits. Extracting never
      # deletes, so the server's .env and data/ survive.
      - name: Ship the deploy files
        run: |
          tar -czf - -C deploy compose.yml env.example scripts caddy \
            | ssh vps 'test -d /opt/lectio || { echo "/opt/lectio does not exist. See docs/DEPLOYMENT.md." >&2; exit 1; }; tar -xzf - -C /opt/lectio'

      - name: Deploy
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          # shellcheck disable=SC2029
          ssh vps "/opt/lectio/scripts/deploy.sh ${TAG} && /opt/lectio/scripts/apply-edge.sh"

      - name: Check the live site
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "${SITE_URL}/healthz" | grep -qF "\"version\":\"${GITHUB_SHA}\""; then
              echo "${SITE_URL} serves ${GITHUB_SHA::7}."
              exit 0
            fi
            sleep 2
          done
          echo "${SITE_URL}/healthz does not report ${GITHUB_SHA}." >&2
          exit 1
